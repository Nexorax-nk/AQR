version: 1
frontend:
  phases:
    preBuild:
      commands:
        - env | grep -E '^(GROQ_API_KEY|AQR_|AWS_|NEXT_PUBLIC_)' >> .env.production || true
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
